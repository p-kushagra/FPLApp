[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    # PuLP 3.3 deprecates APIs in favour of 4.0 equivalents that require an
    # externally installed CBC. We pin <4.0 and keep the bundled solver.
    ignore::DeprecationWarning:pulp.*
