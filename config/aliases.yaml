# FPL <-> Understat entity overrides. Hand-written only.
#
# The resolver NEVER edits this file. It writes low-confidence candidates to
# entity_map with status='unresolved'; the operator reviews them on the Refresh
# Config page and adds a line here. An override is always trusted (confidence 1.0).
overrides: []
  # - fpl_id: 253
  #   understat_id: "1250"
  #   note: "resolver margin below threshold"

# Understat team_title -> FPL teams.short_name.
# Club scoping is what makes resolution deterministic (design doc 6.2), so a
# missing mapping here silently empties a club's candidate set. resolve.aliases
# validates coverage against the teams table and reports gaps.
team_aliases:
  "Arsenal": ARS
  "Aston Villa": AVL
  "Bournemouth": BOU
  "Brentford": BRE
  "Brighton": BHA
  "Burnley": BUR
  "Chelsea": CHE
  "Crystal Palace": CRY
  "Everton": EVE
  "Fulham": FUL
  "Ipswich": IPS
  "Leeds": LEE
  "Leicester": LEI
  "Liverpool": LIV
  "Luton": LUT
  "Manchester City": MCI
  "Manchester United": MUN
  "Newcastle United": NEW
  "Nottingham Forest": NFO
  "Sheffield United": SHU
  "Southampton": SOU
  "Sunderland": SUN
  "Tottenham": TOT
  "West Ham": WHU
  "Wolverhampton Wanderers": WOL
