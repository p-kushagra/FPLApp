# FPL `region` id -> country, with confederation (used for tournament eligibility).
#
# The FPL API returns nationality only as a numeric `region` id and publishes no
# lookup table. These mappings were derived empirically by cross-referencing players
# whose nationality is unambiguous. They are correct for the ids listed, but the list
# is not exhaustive — unmapped ids simply produce no tournament flag.
#
# To add one: find the id on the Rotation & Congestion page ("unmapped regions"),
# then add a line here. No code change needed.

regions:
  241: {country: England,              confederation: UEFA}
  152: {country: Netherlands,          confederation: UEFA}
  200: {country: Spain,                confederation: UEFA}
