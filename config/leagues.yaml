# Mini-league settings.
#
# Which leagues you are in is NOT configured here. It is discovered from your
# own FPL entry (`/entry/{FPL_TEAM_ID}/` -> leagues.classic) and stored in the
# `league` table, so joining a new league needs no edit to this file. Track or
# untrack them, and choose the rival set, on the Leagues & Rivals page.
#
# Only the tuning knobs live here.

default_rival_count: 8   # rivals auto-selected by rank when none are chosen
max_rivals: 20           # caps the per-GW freeze request budget
